<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Render de Juego - Estética Pastelería</title>
<style>
:root{--bg-color:#fce4ec;--container-bg:#fff;--primary-color:#f48fb1;--secondary-color:#81d4fa;--text-color:#4a3b32;--font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif}
body{margin:0;padding:20px;background:var(--bg-color);font-family:var(--font-family);color:var(--text-color);display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{margin-bottom:5px;color:#880e4f;font-size:1.8rem;text-align:center}
p.subtitle{margin:0 0 20px;color:#6d4c41;font-size:.95rem;text-align:center}
.main-container{background:var(--container-bg);padding:20px;border-radius:16px;box-shadow:0 8px 24px rgba(244,143,177,.25);display:flex;flex-direction:column;align-items:center;gap:15px;border:2px solid #f8bbd0;max-width:100%}
.controls{display:flex;gap:15px;flex-wrap:wrap;justify-content:center;align-items:center;background:#fff0f3;padding:10px 15px;border-radius:10px;border:1px solid #ffcdd2}
label{font-weight:600;font-size:.9rem;color:#ad1457}
select,button{padding:6px 12px;border-radius:8px;border:1px solid var(--primary-color);background:#fff;color:var(--text-color);font-family:var(--font-family);font-size:.9rem;cursor:pointer}
select:hover,button:hover:not(:disabled){background:#fce4ec}
button:disabled,select:disabled{opacity:.55;cursor:wait}
button.render-btn{background:var(--primary-color);color:#fff;font-weight:bold;border:none;background:#d81b60}
button.render-btn:hover:not(:disabled){background:#ad1457}
canvas{border:3px solid var(--secondary-color);border-radius:12px;background:#e1f5fe;image-rendering:pixelated;max-width:100%;height:auto}
.estado{margin:0;font-weight:600;min-height:1.4em}
.tabla-scroll{width:100%;overflow-x:auto}
.stats-table{width:100%;border-collapse:collapse;font-size:.85rem}
.stats-table th,.stats-table td{border:1px solid #f8bbd0;padding:6px 10px;text-align:center}
.stats-table th{background:#f8bbd0;color:#880e4f}
.stats-table td{background:#fff;font-variant-numeric:tabular-nums}
.stats-table small{display:block;color:#6d4c41}
.stats-table caption{text-align:left;padding-bottom:6px;color:#6d4c41}
details{width:100%}
textarea{width:100%;min-height:120px;margin:8px 0;font:.85rem ui-monospace,Consolas,monospace;border:1px solid var(--primary-color);border-radius:8px;padding:8px;box-sizing:border-box}
:focus-visible{outline:3px solid #880e4f;outline-offset:2px}
</style>
</head>
<body>
<h1>🍰 Comparativa de Render - Pastelería</h1>
<p class="subtitle">Medición y comparación: Scanline, Ray Tracing y Oclusión Ambiental</p>
<div class="main-container">
  <div class="controls">
    <div><label for="techniqueSelect">Técnica:</label>
      <select id="techniqueSelect">
        <option value="scanline">1. Scanline (Z-Buffer)</option>
        <option value="raytracing">2. Ray Tracing</option>
        <option value="ao">3. Oclusión Ambiental</option>
      </select></div>
    <div><label for="resolutionSelect">Resolución:</label>
      <select id="resolutionSelect">
        <option value="low">Baja (200x150)</option>
        <option value="medium" selected>Media (400x300)</option>
        <option value="high">Alta (600x450)</option>
      </select></div>
    <div><label for="samplesSelect">Muestras AO:</label>
      <select id="samplesSelect"><option>8</option><option selected>16</option><option>32</option><option>64</option></select></div>
    <button class="render-btn" id="renderBtn" type="button">Renderizar</button>
    <button id="compareBtn" type="button">Medir las 3</button>
    <button id="sweepBtn" type="button">Barrido completo</button>
  </div>
  <canvas id="renderCanvas" width="400" height="300" aria-label="Escena de pastelería renderizada"></canvas>
  <p class="estado" id="estado" role="status" aria-live="polite">Preparando…</p>
  <div class="tabla-scroll">
    <table class="stats-table">
      <caption>Tiempo de render en ms (última medición con performance.now())</caption>
      <thead><tr><th>Técnica</th><th>Baja (200x150)</th><th>Media (400x300)</th><th>Alta (600x450)</th></tr></thead>
      <tbody id="statsBody"></tbody>
    </table>
  </div>
  <details><summary>Tabla en Markdown para el README</summary>
    <textarea id="markdown" readonly aria-label="Tabla Markdown"></textarea>
    <button id="copyBtn" type="button">Copiar tabla</button></details>
</div>
<script>
(() => {
'use strict';
/* ============================================================
   Utilidades
   ============================================================ */
const clamp = (x, a, b) => x < a ? a : (x > b ? b : x);
const hex = h => [parseInt(h.slice(1, 3), 16) / 255, parseInt(h.slice(3, 5), 16) / 255, parseInt(h.slice(5, 7), 16) / 255];
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const norm = a => { const l = Math.hypot(a[0], a[1], a[2]); return [a[0] / l, a[1] / l, a[2] / l]; };

/* ============================================================
   Escena (paleta de la pastelería: rosa, lila, turquesa y crema)
   ============================================================ */
const SPHERES = [
  { c: [-1.6, 0.9, 0.0], r: 0.9,  col: hex('#F3A6BB'), ks: 0.5, sh: 48, refl: 0.18 }, // rosa
  { c: [ 1.7, 0.7, 0.8], r: 0.7,  col: hex('#5FBFCF'), ks: 0.5, sh: 48, refl: 0.28 }, // turquesa
  { c: [ 0.1, 0.45, 2.0], r: 0.45, col: hex('#C79BEA'), ks: 0.5, sh: 48, refl: 0.15 }, // lila
  { c: [-2.7, 0.35, 1.9], r: 0.35, col: hex('#C6E36B'), ks: 0.4, sh: 40, refl: 0.10 }  // lima
];
const BOXES = [
  { mn: [ 0.5, 0, -1.4], mx: [ 1.7, 1.0, -0.2], col: hex('#D6BDF0'), ks: 0.15, sh: 16, refl: 0.05 }, // lila claro
  { mn: [-0.6, 0, -2.6], mx: [ 0.2, 1.9, -1.8], col: hex('#7CCBD6'), ks: 0.15, sh: 16, refl: 0.05 }, // turquesa claro
  { mn: [-3.4, 0,  0.5], mx: [-2.6, 0.8,  1.3], col: hex('#8A5535'), ks: 0.12, sh: 14, refl: 0.03 }, // cacao
  { mn: [-3.0, 0, -2.2], mx: [-2.0, 1.0, -1.2], col: hex('#D9A5C2'), ks: 0.15, sh: 16, refl: 0.05 }  // malva
];
const PLANE = {
  y: 0, x0: -60, x1: 60, z0: -80, z1: 7, size: 1.2,
  c1: hex('#FCEBDD'), c2: hex('#F2BCCB'), ks: 0.1, sh: 12, refl: 0.10
};

const EYE = [0.6, 3.0, 8.5];
const TARGET = [0, 0.7, 0];
const FOV = 40 * Math.PI / 180;

const Ld = norm([-0.55, 0.9, 0.55]);
const LX = Ld[0], LY = Ld[1], LZ = Ld[2];
const LC = [1.0, 0.96, 0.90];
const AMB_S = hex('#CFE8F2'), AMB_G = hex('#F7D9CF');
const SKY_TOP = hex('#B4E1EC'), SKY_HOR = hex('#FBDDE4');
const FOG = 0.022;
const EPS = 1e-4;

function sky(dy, out) {
  let t = clamp(dy * 2.2, 0, 1);
  t = t * t * (3 - 2 * t);
  out[0] = SKY_HOR[0] + (SKY_TOP[0] - SKY_HOR[0]) * t;
  out[1] = SKY_HOR[1] + (SKY_TOP[1] - SKY_HOR[1]) * t;
  out[2] = SKY_HOR[2] + (SKY_TOP[2] - SKY_HOR[2]) * t;
}

/* ============================================================
   Cámara
   ============================================================ */
let FX, FY, FZ, RX, RY, RZ, UX, UY, UZ, TANY, TANX, CW, CH;
function setupCamera(w, h) {
  const f = norm(sub(TARGET, EYE));
  const r = norm(cross(f, [0, 1, 0]));
  const u = cross(r, f);
  FX = f[0]; FY = f[1]; FZ = f[2];
  RX = r[0]; RY = r[1]; RZ = r[2];
  UX = u[0]; UY = u[1]; UZ = u[2];
  TANY = Math.tan(FOV / 2);
  TANX = TANY * w / h;
  CW = w; CH = h;
}
let gdx = 0, gdy = 0, gdz = 0;
function camRay(x, y) {
  const sx = (2 * (x + 0.5) / CW - 1) * TANX;
  const sy = (1 - 2 * (y + 0.5) / CH) * TANY;
  const dx = FX + RX * sx + UX * sy;
  const dy = FY + RY * sx + UY * sy;
  const dz = FZ + RZ * sx + UZ * sy;
  const l = 1 / Math.sqrt(dx * dx + dy * dy + dz * dz);
  gdx = dx * l; gdy = dy * l; gdz = dz * l;
}

/* ============================================================
   Materiales
   ============================================================ */
let aR = 0, aG = 0, aB = 0, aKs = 0, aSh = 1, aRf = 0;
function material(type, idx, px, pz) {
  let m;
  if (type === 0) m = SPHERES[idx];
  else if (type === 1) m = BOXES[idx];
  else {
    const k = (Math.floor(px / PLANE.size) + Math.floor(pz / PLANE.size)) & 1;
    const c = k ? PLANE.c1 : PLANE.c2;
    aR = c[0]; aG = c[1]; aB = c[2];
    aKs = PLANE.ks; aSh = PLANE.sh; aRf = PLANE.refl;
    return;
  }
  aR = m.col[0]; aG = m.col[1]; aB = m.col[2];
  aKs = m.ks; aSh = m.sh; aRf = m.refl;
}

/* ============================================================
   Intersección rayo-escena (ray tracing y oclusión ambiental)
   ============================================================ */
let hT = 0, hType = -1, hIdx = 0, hNx = 0, hNy = 0, hNz = 0;
function trace(ox, oy, oz, dx, dy, dz, tmax) {
  let best = tmax, type = -1, idx = 0;

  for (let i = 0; i < SPHERES.length; i++) {
    const s = SPHERES[i], c = s.c;
    const lx = ox - c[0], ly = oy - c[1], lz = oz - c[2];
    const b = lx * dx + ly * dy + lz * dz;
    const cc = lx * lx + ly * ly + lz * lz - s.r * s.r;
    const disc = b * b - cc;
    if (disc > 0) {
      const sq = Math.sqrt(disc);
      let t = -b - sq;
      if (t < EPS) t = -b + sq;
      if (t > EPS && t < best) { best = t; type = 0; idx = i; }
    }
  }

  const idxx = 1 / (dx === 0 ? 1e-12 : dx);
  const idxy = 1 / (dy === 0 ? 1e-12 : dy);
  const idxz = 1 / (dz === 0 ? 1e-12 : dz);
  for (let i = 0; i < BOXES.length; i++) {
    const mn = BOXES[i].mn, mx = BOXES[i].mx;
    let tn = -1e30, tf = 1e30, t1, t2, q;
    t1 = (mn[0] - ox) * idxx; t2 = (mx[0] - ox) * idxx;
    if (t1 > t2) { q = t1; t1 = t2; t2 = q; }
    if (t1 > tn) tn = t1; if (t2 < tf) tf = t2;
    t1 = (mn[1] - oy) * idxy; t2 = (mx[1] - oy) * idxy;
    if (t1 > t2) { q = t1; t1 = t2; t2 = q; }
    if (t1 > tn) tn = t1; if (t2 < tf) tf = t2;
    t1 = (mn[2] - oz) * idxz; t2 = (mx[2] - oz) * idxz;
    if (t1 > t2) { q = t1; t1 = t2; t2 = q; }
    if (t1 > tn) tn = t1; if (t2 < tf) tf = t2;
    if (tn <= tf && tn > EPS && tn < best) { best = tn; type = 1; idx = i; }
  }

  if (dy > 1e-9 || dy < -1e-9) {
    const t = (PLANE.y - oy) / dy;
    if (t > EPS && t < best) {
      const x = ox + dx * t, z = oz + dz * t;
      if (x > PLANE.x0 && x < PLANE.x1 && z > PLANE.z0 && z < PLANE.z1) { best = t; type = 2; idx = 0; }
    }
  }

  hT = best; hType = type; hIdx = idx;
  if (type === 0) {
    const s = SPHERES[idx], inv = 1 / s.r;
    hNx = (ox + dx * best - s.c[0]) * inv;
    hNy = (oy + dy * best - s.c[1]) * inv;
    hNz = (oz + dz * best - s.c[2]) * inv;
  } else if (type === 1) {
    const b = BOXES[idx];
    const px = ox + dx * best, py = oy + dy * best, pz = oz + dz * best;
    let bd = 1e30, d;
    hNx = 0; hNy = 0; hNz = 0;
    d = Math.abs(px - b.mn[0]); if (d < bd) { bd = d; hNx = -1; hNy = 0; hNz = 0; }
    d = Math.abs(px - b.mx[0]); if (d < bd) { bd = d; hNx = 1; hNy = 0; hNz = 0; }
    d = Math.abs(py - b.mn[1]); if (d < bd) { bd = d; hNx = 0; hNy = -1; hNz = 0; }
    d = Math.abs(py - b.mx[1]); if (d < bd) { bd = d; hNx = 0; hNy = 1; hNz = 0; }
    d = Math.abs(pz - b.mn[2]); if (d < bd) { bd = d; hNx = 0; hNy = 0; hNz = -1; }
    d = Math.abs(pz - b.mx[2]); if (d < bd) { bd = d; hNx = 0; hNy = 0; hNz = 1; }
  } else {
    hNx = 0; hNy = 1; hNz = 0;
  }
}

/* ============================================================
   Técnica 1: scanline (triángulos + z-buffer, sin sombras)
   ============================================================ */
const TRIS = [];
function addTri(a, b, c, type, idx) { TRIS.push({ v: [a, b, c], type, idx }); }

function buildMesh() {
  TRIS.length = 0;

  // Esferas: malla de latitud/longitud con normales suaves
  const SEG = 32, RINGS = 20;
  SPHERES.forEach((s, idx) => {
    const g = [];
    for (let j = 0; j <= RINGS; j++) {
      const th = Math.PI * j / RINGS, row = [];
      for (let i = 0; i <= SEG; i++) {
        const ph = 2 * Math.PI * i / SEG;
        const nx = Math.sin(th) * Math.cos(ph), ny = Math.cos(th), nz = Math.sin(th) * Math.sin(ph);
        row.push([s.c[0] + nx * s.r, s.c[1] + ny * s.r, s.c[2] + nz * s.r, nx, ny, nz]);
      }
      g.push(row);
    }
    for (let j = 0; j < RINGS; j++) {
      for (let i = 0; i < SEG; i++) {
        addTri(g[j][i], g[j + 1][i], g[j + 1][i + 1], 0, idx);
        addTri(g[j][i], g[j + 1][i + 1], g[j][i + 1], 0, idx);
      }
    }
  });

  // Cubos: seis caras con normal plana
  const quad = (n, p0, p1, p2, p3, idx) => {
    const v = p => [p[0], p[1], p[2], n[0], n[1], n[2]];
    addTri(v(p0), v(p1), v(p2), 1, idx);
    addTri(v(p0), v(p2), v(p3), 1, idx);
  };
  BOXES.forEach((b, idx) => {
    const [x0, y0, z0] = b.mn, [x1, y1, z1] = b.mx;
    quad([ 1, 0, 0], [x1, y0, z0], [x1, y1, z0], [x1, y1, z1], [x1, y0, z1], idx);
    quad([-1, 0, 0], [x0, y0, z0], [x0, y1, z0], [x0, y1, z1], [x0, y0, z1], idx);
    quad([0,  1, 0], [x0, y1, z0], [x1, y1, z0], [x1, y1, z1], [x0, y1, z1], idx);
    quad([0, -1, 0], [x0, y0, z0], [x1, y0, z0], [x1, y0, z1], [x0, y0, z1], idx);
    quad([0, 0,  1], [x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1], idx);
    quad([0, 0, -1], [x0, y0, z0], [x1, y0, z0], [x1, y1, z0], [x0, y1, z0], idx);
  });

  // Plano
  const n = [0, 1, 0], P = PLANE;
  const pv = (x, z) => [x, P.y, z, n[0], n[1], n[2]];
  addTri(pv(P.x0, P.z0), pv(P.x1, P.z0), pv(P.x1, P.z1), 2, 0);
  addTri(pv(P.x0, P.z0), pv(P.x1, P.z1), pv(P.x0, P.z1), 2, 0);
}

const NEAR = 0.05;
function camVert(v) {
  const x = v[0] - EYE[0], y = v[1] - EYE[1], z = v[2] - EYE[2];
  return [x * RX + y * RY + z * RZ, x * UX + y * UY + z * UZ, x * FX + y * FY + z * FZ, v[0], v[1], v[2], v[3], v[4], v[5]];
}
function clipNear(poly) {
  const out = [];
  for (let i = 0; i < poly.length; i++) {
    const a = poly[i], b = poly[(i + 1) % poly.length];
    const ain = a[2] >= NEAR, bin = b[2] >= NEAR;
    if (ain) out.push(a);
    if (ain !== bin) {
      const t = (NEAR - a[2]) / (b[2] - a[2]);
      const c = new Array(9);
      for (let k = 0; k < 9; k++) c[k] = a[k] + (b[k] - a[k]) * t;
      c[2] = NEAR;
      out.push(c);
    }
  }
  return out;
}
// Vértice en pantalla: [sx, sy, 1/w, p/w (3), n/w (3)] para interpolar con perspectiva correcta
function project(v) {
  const iw = 1 / v[2];
  return Float64Array.of(
    (v[0] * iw / TANX * 0.5 + 0.5) * CW,
    (0.5 - v[1] * iw / TANY * 0.5) * CH,
    iw,
    v[3] * iw, v[4] * iw, v[5] * iw,
    v[6] * iw, v[7] * iw, v[8] * iw
  );
}

const EDGE_L = new Float64Array(9), EDGE_R = new Float64Array(9);

function fillTriangle(A, B, C, type, idx, data, depth) {
  let v0 = A, v1 = B, v2 = C, q;
  if (v0[1] > v1[1]) { q = v0; v0 = v1; v1 = q; }
  if (v1[1] > v2[1]) { q = v1; v1 = v2; v2 = q; }
  if (v0[1] > v1[1]) { q = v0; v0 = v1; v1 = q; }
  const y0 = v0[1], y1 = v1[1], y2 = v2[1];
  if (y2 - y0 < 1e-9) return;
  const ys = Math.max(0, Math.ceil(y0 - 0.5));
  const ye = Math.min(CH - 1, Math.floor(y2 - 0.5));

  for (let y = ys; y <= ye; y++) {
    const yc = y + 0.5;
    const tL = (yc - y0) / (y2 - y0);
    for (let k = 0; k < 9; k++) EDGE_L[k] = v0[k] + (v2[k] - v0[k]) * tL;
    if (yc < y1) {
      const den = y1 - y0, t = den < 1e-9 ? 0 : (yc - y0) / den;
      for (let k = 0; k < 9; k++) EDGE_R[k] = v0[k] + (v1[k] - v0[k]) * t;
    } else {
      const den = y2 - y1, t = den < 1e-9 ? 0 : (yc - y1) / den;
      for (let k = 0; k < 9; k++) EDGE_R[k] = v1[k] + (v2[k] - v1[k]) * t;
    }
    let a = EDGE_L, b = EDGE_R;
    if (a[0] > b[0]) { a = EDGE_R; b = EDGE_L; }
    const xs = Math.max(0, Math.ceil(a[0] - 0.5));
    const xe = Math.min(CW - 1, Math.floor(b[0] - 0.5));
    const span = b[0] - a[0];

    for (let x = xs; x <= xe; x++) {
      const t = span < 1e-9 ? 0 : (x + 0.5 - a[0]) / span;
      const iw = a[2] + (b[2] - a[2]) * t;
      const di = y * CW + x;
      if (iw <= depth[di]) continue;
      depth[di] = iw;

      const px = (a[3] + (b[3] - a[3]) * t) / iw;
      const py = (a[4] + (b[4] - a[4]) * t) / iw;
      const pz = (a[5] + (b[5] - a[5]) * t) / iw;
      let nx = a[6] + (b[6] - a[6]) * t;
      let ny = a[7] + (b[7] - a[7]) * t;
      let nz = a[8] + (b[8] - a[8]) * t;
      const nl = 1 / Math.hypot(nx, ny, nz);
      nx *= nl; ny *= nl; nz *= nl;

      material(type, idx, px, pz);
      const ndl = nx * LX + ny * LY + nz * LZ;
      const hemi = ny * 0.5 + 0.5;
      const ar = (AMB_G[0] + (AMB_S[0] - AMB_G[0]) * hemi) * 0.5;
      const ag = (AMB_G[1] + (AMB_S[1] - AMB_G[1]) * hemi) * 0.5;
      const ab = (AMB_G[2] + (AMB_S[2] - AMB_G[2]) * hemi) * 0.5;
      const dif = ndl > 0 ? ndl * 0.62 : 0;

      const vx = EYE[0] - px, vy = EYE[1] - py, vz = EYE[2] - pz;
      const dist = Math.hypot(vx, vy, vz), vl = 1 / dist;
      let spec = 0;
      if (ndl > 0) {
        let hx = LX + vx * vl, hy = LY + vy * vl, hz = LZ + vz * vl;
        const hl = 1 / Math.hypot(hx, hy, hz);
        const nh = (nx * hx + ny * hy + nz * hz) * hl;
        if (nh > 0) spec = aKs * Math.pow(nh, aSh);
      }
      let r = aR * (ar + dif * LC[0]) + spec;
      let g = aG * (ag + dif * LC[1]) + spec;
      let bl = aB * (ab + dif * LC[2]) + spec;
      const f = 1 - Math.exp(-dist * FOG);
      r += (SKY_HOR[0] - r) * f; g += (SKY_HOR[1] - g) * f; bl += (SKY_HOR[2] - bl) * f;

      const o = di * 4;
      data[o] = r * 255; data[o + 1] = g * 255; data[o + 2] = bl * 255;
    }
  }
}

function renderScanline(w, h, data) {
  setupCamera(w, h);
  if (!TRIS.length) buildMesh();
  const depth = new Float64Array(w * h); // guarda 1/w: mayor valor = más cerca
  const c = new Float64Array(3);

  // Fondo: cielo
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      camRay(x, y);
      sky(gdy, c);
      const o = (y * w + x) * 4;
      data[o] = c[0] * 255; data[o + 1] = c[1] * 255; data[o + 2] = c[2] * 255; data[o + 3] = 255;
    }
  }

  for (let i = 0; i < TRIS.length; i++) {
    const t = TRIS[i];
    const cv = [camVert(t.v[0]), camVert(t.v[1]), camVert(t.v[2])];
    if (cv[0][2] < NEAR && cv[1][2] < NEAR && cv[2][2] < NEAR) continue;
    const poly = clipNear(cv);
    if (poly.length < 3) continue;
    const pv = poly.map(project);
    for (let k = 1; k < pv.length - 1; k++) fillTriangle(pv[0], pv[k], pv[k + 1], t.type, t.idx, data, depth);
  }
}

/* ============================================================
   Técnica 2: ray tracing (sombras duras + un rebote de reflejo)
   ============================================================ */
const REFL_BUF = [new Float64Array(3), new Float64Array(3)];

function rtShade(ox, oy, oz, dx, dy, dz, depth, out) {
  trace(ox, oy, oz, dx, dy, dz, 1e30);
  if (hType < 0) { sky(dy, out); return; }
  const t = hT, type = hType, idx = hIdx, nx = hNx, ny = hNy, nz = hNz;
  const px = ox + dx * t, py = oy + dy * t, pz = oz + dz * t;
  material(type, idx, px, pz);
  const cr = aR, cg = aG, cb = aB, ks = aKs, sh = aSh, rf = aRf;

  const ndl = nx * LX + ny * LY + nz * LZ;
  let lit = 0;
  if (ndl > 0) {
    trace(px + nx * 1e-3, py + ny * 1e-3, pz + nz * 1e-3, LX, LY, LZ, 1e30);
    lit = hType < 0 ? 1 : 0;
  }
  const hemi = ny * 0.5 + 0.5;
  const ar = (AMB_G[0] + (AMB_S[0] - AMB_G[0]) * hemi) * 0.5;
  const ag = (AMB_G[1] + (AMB_S[1] - AMB_G[1]) * hemi) * 0.5;
  const ab = (AMB_G[2] + (AMB_S[2] - AMB_G[2]) * hemi) * 0.5;
  const dif = lit ? ndl * 0.62 : 0;
  let spec = 0;
  if (lit) {
    const hx = LX - dx, hy = LY - dy, hz = LZ - dz;
    const hl = 1 / Math.hypot(hx, hy, hz);
    const nh = (nx * hx + ny * hy + nz * hz) * hl;
    if (nh > 0) spec = ks * Math.pow(nh, sh);
  }
  let r = cr * (ar + dif * LC[0]) + spec;
  let g = cg * (ag + dif * LC[1]) + spec;
  let b = cb * (ab + dif * LC[2]) + spec;

  if (depth < 2 && rf > 0) {
    const dn = dx * nx + dy * ny + dz * nz;
    const buf = REFL_BUF[depth];
    rtShade(px + nx * 1e-3, py + ny * 1e-3, pz + nz * 1e-3,
            dx - 2 * dn * nx, dy - 2 * dn * ny, dz - 2 * dn * nz, depth + 1, buf);
    r = r * (1 - rf) + buf[0] * rf;
    g = g * (1 - rf) + buf[1] * rf;
    b = b * (1 - rf) + buf[2] * rf;
  }
  const f = 1 - Math.exp(-t * FOG);
  out[0] = r + (SKY_HOR[0] - r) * f;
  out[1] = g + (SKY_HOR[1] - g) * f;
  out[2] = b + (SKY_HOR[2] - b) * f;
}

function renderRay(w, h, data) {
  setupCamera(w, h);
  const out = new Float64Array(3);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      camRay(x, y);
      rtShade(EYE[0], EYE[1], EYE[2], gdx, gdy, gdz, 0, out);
      const o = (y * w + x) * 4;
      data[o] = out[0] * 255; data[o + 1] = out[1] * 255; data[o + 2] = out[2] * 255; data[o + 3] = 255;
    }
  }
}

/* ============================================================
   Técnica 3: oclusión ambiental (rayos sobre el hemisferio)
   ============================================================ */
const AO_RADIO = 1.6;

function aoShade(ox, oy, oz, dx, dy, dz, muestras, rot, out) {
  trace(ox, oy, oz, dx, dy, dz, 1e30);
  if (hType < 0) { sky(dy, out); return; }
  const t = hT, type = hType, idx = hIdx, nx = hNx, ny = hNy, nz = hNz;
  const px = ox + dx * t, py = oy + dy * t, pz = oz + dz * t;
  material(type, idx, px, pz);
  const cr = aR, cg = aG, cb = aB;

  // Base ortonormal alrededor de la normal
  let tx, ty, tz;
  if (Math.abs(nx) < 0.9) { tx = 0; ty = nz; tz = -ny; } else { tx = -nz; ty = 0; tz = nx; }
  const tl = 1 / Math.hypot(tx, ty, tz); tx *= tl; ty *= tl; tz *= tl;
  const bx = ny * tz - nz * ty, by = nz * tx - nx * tz, bz = nx * ty - ny * tx;

  const sx0 = px + nx * 1e-3, sy0 = py + ny * 1e-3, sz0 = pz + nz * 1e-3;
  let occ = 0;
  for (let i = 0; i < muestras; i++) {
    const u1 = (i + 0.5) / muestras;
    let u2 = i * 0.7548776662466927 + rot; u2 -= Math.floor(u2);
    const rr = Math.sqrt(u1), ph = 6.283185307179586 * u2;
    const lx = rr * Math.cos(ph), ly = rr * Math.sin(ph), lz = Math.sqrt(1 - u1);
    trace(sx0, sy0, sz0,
          tx * lx + bx * ly + nx * lz,
          ty * lx + by * ly + ny * lz,
          tz * lx + bz * ly + nz * lz, AO_RADIO);
    if (hType >= 0) occ += 1 - hT / AO_RADIO;
  }
  const ao = 1 - occ / muestras;
  const k = 0.18 + 0.82 * ao * ao;
  const ndl = Math.max(0, nx * LX + ny * LY + nz * LZ);
  const hemi = ny * 0.5 + 0.5;
  const ar = (AMB_G[0] + (AMB_S[0] - AMB_G[0]) * hemi) * 1.05;
  const ag = (AMB_G[1] + (AMB_S[1] - AMB_G[1]) * hemi) * 1.05;
  const ab = (AMB_G[2] + (AMB_S[2] - AMB_G[2]) * hemi) * 1.05;
  let r = cr * (ar * k + ndl * 0.14);
  let g = cg * (ag * k + ndl * 0.14);
  let b = cb * (ab * k + ndl * 0.14);
  const f = 1 - Math.exp(-t * FOG);
  out[0] = r + (SKY_HOR[0] - r) * f;
  out[1] = g + (SKY_HOR[1] - g) * f;
  out[2] = b + (SKY_HOR[2] - b) * f;
}

function renderAO(w, h, data, muestras) {
  setupCamera(w, h);
  const out = new Float64Array(3);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      camRay(x, y);
      // Rotación aleatoria por píxel (hash entero) para repartir el ruido
      let s = (Math.imul(x, 374761393) + Math.imul(y, 668265263)) | 0;
      s = Math.imul(s ^ (s >>> 13), 1274126177);
      s ^= s >>> 16;
      const rot = (s >>> 0) / 4294967296;
      aoShade(EYE[0], EYE[1], EYE[2], gdx, gdy, gdz, muestras, rot, out);
      const o = (y * w + x) * 4;
      data[o] = out[0] * 255; data[o + 1] = out[1] * 255; data[o + 2] = out[2] * 255; data[o + 3] = 255;
    }
  }
}


/* ============================================================
   Medición y comparación (parte de medición)
   Para integrar la versión de tu equipo de una técnica, cambia su `fn` en TECH
   por una función con la firma (ancho, alto, datosImageData, muestras).
   ============================================================ */
const $ = id => document.getElementById(id);
const canvas = $('renderCanvas'), ctx = canvas.getContext('2d');
const RES = { low: [200, 150], medium: [400, 300], high: [600, 450] };
const RES_ORD = ['low', 'medium', 'high'];
const resTxt = k => RES[k][0] + 'x' + RES[k][1];
const TECH = {
  scanline:   { nombre: 'Scanline',           fn: renderScanline },
  raytracing: { nombre: 'Ray Tracing',        fn: renderRay },
  ao:         { nombre: 'Oclusión Ambiental', fn: renderAO }
};
const ORD = Object.keys(TECH);
const medidas = {};
let ocupado = false;
const fmt = ms => ms.toFixed(2);
const pausa = () => new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
const sel = () => ({ tec: $('techniqueSelect').value, res: $('resolutionSelect').value, m: parseInt($('samplesSelect').value, 10) });

function bloquear(b) {
  ocupado = b;
  ['renderBtn', 'compareBtn', 'sweepBtn', 'techniqueSelect', 'resolutionSelect', 'samplesSelect'].forEach(id => $(id).disabled = b);
}

async function medir(tec, res, m) {
  const [w, h] = RES[res];
  canvas.width = w; canvas.height = h;
  $('estado').textContent = 'Renderizando ' + TECH[tec].nombre + ' a ' + resTxt(res) + '…';
  await pausa();
  const img = ctx.createImageData(w, h);
  const t0 = performance.now();
  TECH[tec].fn(w, h, img.data, m);
  const ms = performance.now() - t0;
  ctx.putImageData(img, 0, 0);
  medidas[tec + '|' + res] = { ms, m };
  $('estado').textContent = TECH[tec].nombre + ' · ' + resTxt(res) + ' · ' + fmt(ms) + ' ms' + (tec === 'ao' ? ' · ' + m + ' muestras' : '');
  pintarTabla();
}

function pintarTabla() {
  const body = $('statsBody');
  body.textContent = '';
  for (const tec of ORD) {
    const tr = document.createElement('tr');
    const th = document.createElement('td'); th.textContent = TECH[tec].nombre; tr.appendChild(th);
    for (const r of RES_ORD) {
      const td = document.createElement('td'), d = medidas[tec + '|' + r];
      td.textContent = d ? fmt(d.ms) + ' ms' : '-';
      if (d && tec === 'ao') { const s = document.createElement('small'); s.textContent = d.m + ' muestras'; td.appendChild(s); }
      tr.appendChild(td);
    }
    body.appendChild(tr);
  }
  const cab = '| Técnica | ' + RES_ORD.map(resTxt).join(' | ') + ' |\n|---|---|---|---|';
  const filas = ORD.map(t => '| ' + TECH[t].nombre + ' | ' + RES_ORD.map(r => {
    const d = medidas[t + '|' + r];
    return d ? fmt(d.ms) + ' ms' + (t === 'ao' ? ' (' + d.m + ' muestras)' : '') : '-';
  }).join(' | ') + ' |');
  $('markdown').value = [cab, ...filas].join('\n');
}

async function correr(fn) { if (ocupado) return; bloquear(true); await fn(); bloquear(false); }
const renderActual = () => correr(() => { const s = sel(); return medir(s.tec, s.res, s.m); });
const comparar = () => correr(async () => { const s = sel(); for (const t of ORD) await medir(t, s.res, s.m); await medir(s.tec, s.res, s.m); });
const barrido = () => correr(async () => { const s = sel(); for (const r of RES_ORD) for (const t of ORD) await medir(t, r, s.m); });

$('techniqueSelect').addEventListener('change', renderActual);
$('resolutionSelect').addEventListener('change', renderActual);
$('samplesSelect').addEventListener('change', () => { if (sel().tec === 'ao') renderActual(); });
$('renderBtn').addEventListener('click', renderActual);
$('compareBtn').addEventListener('click', comparar);
$('sweepBtn').addEventListener('click', barrido);
$('copyBtn').addEventListener('click', async () => {
  const ta = $('markdown');
  try { await navigator.clipboard.writeText(ta.value); } catch (e) { ta.select(); document.execCommand('copy'); }
  $('copyBtn').textContent = 'Copiada'; setTimeout(() => $('copyBtn').textContent = 'Copiar tabla', 1500);
});
pintarTabla();
window.addEventListener('load', renderActual);
})();
</script>
